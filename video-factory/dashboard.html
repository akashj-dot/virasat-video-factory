<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Virasat Video Factory</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel2: #1e222b; --line: #2a2f3a;
    --txt: #e7e9ee; --dim: #9aa2b1; --accent: #6c8cff;
    --building: #9b8cff; --queued: #6b7280; --voicing: #d9a441; --rendering: #4a9eff; --done: #37c980; --failed: #f0576b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--txt); font-family: "Outfit", system-ui, sans-serif; }
  .stickytop { position: sticky; top: 0; z-index: 5; }
  header {
    background: rgba(15,17,21,.92); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line); padding: 16px 24px;
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; column-gap: 16px;
  }
  .brand { grid-column: 2; justify-self: center; display: flex; align-items: center; gap: 10px; }
  .rightgroup { grid-column: 3; justify-self: end; display: flex; align-items: center; gap: 24px; flex-wrap: wrap; }
  .brand .logo { height: 24px; width: auto; display: block; }
  .brand .appname { font-size: 20px; font-weight: 800; margin: 0; letter-spacing: -.3px; color: var(--txt); }
  .stats { display: flex; gap: 18px; flex-wrap: wrap; }
  .stat { display: flex; flex-direction: column; align-items: center; min-width: 54px; }
  .stat b { font-size: 20px; font-weight: 700; line-height: 1; }
  .stat small { color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .5px; margin-top: 4px; }
  .eta { color: var(--dim); font-size: 13px; }
  .eta b { color: var(--txt); font-weight: 600; }
  .active-num { color: var(--accent) !important; font-size: 16px; font-weight: 800; }
  button {
    font-family: inherit; font-weight: 600; font-size: 13px; border: 1px solid var(--line);
    background: var(--panel2); color: var(--txt); padding: 8px 16px; border-radius: 9px; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.pause.on { background: var(--voicing); color: #201700; border-color: var(--voicing); }
  main { padding: 20px 24px; }
  .board { display: flex; gap: 16px; align-items: flex-start; }
  .pane { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; display: flex; flex-direction: column; max-height: calc(100vh - 170px); min-width: 0; overflow: hidden; }
  .pane-done { flex: 0 0 75%; max-width: 75%; }
  .pane-others { flex: 1 1 25%; max-width: 25%; overflow-y: auto; }
  .column-head { padding: 12px 14px; font-size: 12.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; color: var(--dim); display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--line); flex: 0 0 auto; }
  .column-head .dot-status { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .column-head .count { margin-left: auto; background: var(--panel2); padding: 2px 9px; border-radius: 20px; font-size: 11px; color: var(--txt); }
  .column-body { padding: 10px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; flex: 1; }
  .pane-done .column-body { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; align-content: start; }
  .pane-done .column-body > .card { min-width: 0; }
  .mini-section { border-bottom: 1px solid var(--line); }
  .mini-section:last-child { border-bottom: none; }
  .mini-section .column-body { flex: none; overflow: visible; }
  .column-empty { grid-column: 1 / -1; color: var(--dim); font-size: 12px; text-align: center; padding: 24px 10px; font-style: italic; }
  .card { position: relative; background: var(--panel2); border: 1px solid var(--line); border-left: 3px solid var(--queued); border-radius: 12px; padding: 14px; }
  .card.done .title { font-size: 18px; }
  .card.done .top { padding-right: 92px; }
  .card-del { position: absolute; top: 10px; right: 10px; display: flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; line-height: 1; border-radius: 7px; padding: 6px 10px 6px 8px; }
  .card-del svg { width: 13px; height: 13px; flex: 0 0 auto; }
  .card-del:hover { border-color: var(--failed); color: var(--failed); }
  .card-del.confirm { background: var(--failed); color: #2a0d13; border-color: var(--failed); font-weight: 700; }
  .card.building { border-left-color: var(--building); }
  .card.voicing { border-left-color: var(--voicing); }
  .card.rendering { border-left-color: var(--rendering); }
  .card.done { border-left-color: var(--done); }
  .card.failed { border-left-color: var(--failed); }
  .card .top { display: flex; align-items: center; gap: 10px; }
  .title { font-weight: 600; font-size: 15px; line-height: 1.3; }
  .brief { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); font-size: 12.5px; line-height: 1.55; color: var(--dim); white-space: pre-wrap; max-height: 92px; overflow: hidden; -webkit-mask-image: linear-gradient(#000 60%, transparent); mask-image: linear-gradient(#000 60%, transparent); }
  .brief.open { max-height: none; -webkit-mask-image: none; mask-image: none; }
  .brief b { color: var(--txt); font-weight: 600; }
  .more { margin-top: 4px; background: none; border: none; color: var(--accent); font-size: 12px; font-weight: 600; padding: 2px 0; cursor: pointer; }
  .more:hover { text-decoration: underline; border-color: transparent; }
  .fmt { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 28px; flex: 0 0 auto; }
  .fmt > i { border: 2px solid var(--accent); border-radius: 2px; display: block; }
  .age { color: var(--dim); font-size: 12px; }
  .pos { color: var(--accent); font-size: 12px; font-weight: 600; opacity: .8; }
  .meta { color: var(--dim); font-size: 12px; margin-top: 8px; display: flex; gap: 12px; flex-wrap: wrap; }
  .spinner { width: 12px; height: 12px; border: 2px solid rgba(255,255,255,.2); border-top-color: currentColor; border-radius: 50%; display: inline-block; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .err { margin-top: 10px; background: #241318; border: 1px solid #3a1f26; color: #f3a9b3; font-size: 11px; font-family: ui-monospace, monospace; padding: 8px; border-radius: 7px; white-space: pre-wrap; max-height: 120px; overflow: auto; }
  .actions { margin-top: 10px; display: flex; gap: 8px; }
  .actions button { padding: 5px 12px; font-size: 12px; }
  .actions .danger:hover { border-color: var(--failed); }
  .actions .danger.confirm { background: var(--failed); color: #2a0d13; border-color: var(--failed); }
  .thumb-wrap { position: relative; margin-top: 10px; border-radius: 8px; overflow: hidden; background: #000; cursor: pointer; height: 190px; display: flex; align-items: center; justify-content: center; }
  .thumb-wrap img { max-width: 100%; max-height: 100%; display: block; }
  .thumb-wrap video { width: 100%; height: 100%; object-fit: contain; background: #000; }
  .thumb-wrap .playbtn { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; transition: background .15s; }
  .thumb-wrap:hover .playbtn { background: rgba(0,0,0,.15); }
  .playbtn i { width: 54px; height: 54px; border-radius: 50%; background: rgba(0,0,0,.6); border: 1px solid rgba(255,255,255,.25); display: flex; align-items: center; justify-content: center; }
  .playbtn i::after { content: ""; border-style: solid; border-width: 9px 0 9px 15px; border-color: transparent transparent transparent #fff; margin-left: 3px; }
  .metarow { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .metatag { font-size: 11px; background: var(--panel); border: 1px solid var(--line); color: var(--dim); padding: 3px 8px; border-radius: 6px; white-space: nowrap; }
  .metatag b { color: var(--txt); font-weight: 600; }
  .fname { margin-top: 8px; font-size: 11.5px; color: var(--dim); cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fname:hover { color: var(--txt); }
  .empty { color: var(--dim); text-align: center; padding: 60px 20px; font-size: 15px; }
  .empty code { background: var(--panel2); padding: 3px 8px; border-radius: 6px; color: var(--accent); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--done); display: inline-block; }
  .offline .dot { background: var(--failed); }
  .banner { display: none; position: sticky; top: 0; z-index: 10; background: #3a1f26; color: #f3a9b3; border-bottom: 1px solid var(--failed); padding: 12px 24px; font-size: 14px; font-weight: 600; text-align: center; }
  .banner.show { display: block; }
  .banner b { color: #fff; background: #5a2530; padding: 2px 8px; border-radius: 5px; }
  .pausedbanner { background: #2a2410; color: #e8c766; border-bottom-color: var(--voicing); }
  .pausedbanner b { background: #4a3f14; }
  .idle { color: var(--dim); font-style: italic; }

  .toolbar {
    background: rgba(15,17,21,.96); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line); padding: 12px 24px; display: flex; align-items: center;
    gap: 10px; flex-wrap: wrap;
  }
  .search {
    font-family: inherit; font-size: 13px; color: var(--txt); background: var(--panel2);
    border: 1px solid var(--line); border-radius: 9px; padding: 8px 12px 8px 32px; width: 220px;
    background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" stroke="%239aa2b1" stroke-width="2"><circle cx="6" cy="6" r="5"/><line x1="10" y1="10" x2="13.5" y2="13.5"/></svg>');
    background-repeat: no-repeat; background-position: 10px center;
  }
  .search:focus { outline: none; border-color: var(--accent); }
  .search::placeholder { color: var(--dim); }
  .shown { color: var(--dim); font-size: 12px; margin-left: auto; white-space: nowrap; }
</style>
</head>
<body>
<div id="offline" class="banner">⚠ Can't reach the runner. Double-click <b>start.command</b> in the video-factory folder — this page reconnects on its own.</div>
<div id="paused" class="banner pausedbanner">⏸ PAUSED — nothing is being generated right now. Press <b>Resume</b> (top-right) to start processing.</div>
<div class="stickytop">
<header>
  <div></div>
  <div class="brand">
    <img class="logo" src="/brand/logo/virasat-logo-full-trimmed.png" alt="Virasat" />
    <span class="appname">Video Factory</span>
  </div>
  <div class="rightgroup">
    <div class="stats" id="stats"></div>
    <div class="eta" id="eta"></div>
    <button class="pause" id="pauseBtn" onclick="togglePause()">Pause</button>
    <span id="conn" title="connection"><span class="dot"></span></span>
  </div>
</header>
<div class="toolbar">
  <input class="search" id="search" type="text" placeholder="Search title…" oninput="onFilterChange()" />
  <span class="shown" id="shown"></span>
</div>
</div>
<main id="main">
  <div class="empty">Connecting to runner…</div>
</main>

<script>
let paused = false;
let lastManifest = null;
let lastSig = "";
const expanded = new Set();
const playing = new Set(); // done-card ids currently showing the real <video> instead of a poster
const order = ["done", "building", "rendering", "voicing", "queued", "failed"];
const labels = { building: "Building", rendering: "Rendering", voicing: "Voicing", queued: "Queued", failed: "Failed", done: "Done" };

// ---- search (title only) ----
let searchQuery = "";
function onFilterChange() {
  searchQuery = document.getElementById("search").value;
  lastSig = ""; // force a rebuild even though the manifest itself hasn't changed
  if (lastManifest) render(lastManifest);
}

function fmt(s) { s = Math.max(0, Math.round(s)); const m = Math.floor(s / 60); return m ? `${m}m ${s % 60}s` : `${s}s`; }

function setOffline(off) {
  document.getElementById("offline").classList.toggle("show", off);
  document.getElementById("conn").className = off ? "offline" : "";
}

async function poll() {
  let m;
  try { m = await (await fetch("/manifest.json", { cache: "no-store" })).json(); }
  catch { setOffline(true); return; }
  setOffline(false);
  render(m);
}

// Pull the fields worth showing as badges out of a job's BRIEF.md text (frontmatter + body).
const skillLabels = { "faceless-explainer": "Faceless Explainer", "product-launch-video": "Product Launch", "general-video": "General Video", "motion-graphics": "Motion Graphics", "slideshow": "Slideshow" };
function parseBrief(brief) {
  if (!brief) return {};
  const fm = brief.match(/^---\n([\s\S]*?)\n---/);
  const get = (k) => {
    if (!fm) return null;
    const m = fm[1].match(new RegExp(`^${k}:\\s*"?([^"\\n]+?)"?\\s*$`, "m"));
    return m ? m[1].trim() : null;
  };
  const themeM = brief.match(/theme:\s*(light|dark)/i);
  const angle = get("angle");
  return {
    language: get("language"),
    angle: angle ? angle.split(" (")[0] : null,
    style: get("style_preset"),
    theme: themeM ? themeM[1][0].toUpperCase() + themeM[1].slice(1).toLowerCase() : null,
    voice: get("voice"),
    destination: get("destination"),
    length: get("length"),
  };
}
function metaTags(j) {
  const b = parseBrief(j.brief);
  const tags = [];
  const skill = skillLabels[j.skill] || j.skill;
  if (skill) tags.push(`<span class="metatag">Skill: <b>${escapeHtml(skill)}</b></span>`);
  if (b.theme) tags.push(`<span class="metatag">Theme: <b>${escapeHtml(b.theme)}</b></span>`);
  if (b.language) tags.push(`<span class="metatag">Lang: <b>${escapeHtml(b.language.toUpperCase())}</b></span>`);
  if (b.angle) tags.push(`<span class="metatag">Tone: <b>${escapeHtml(b.angle)}</b></span>`);
  if (b.style) tags.push(`<span class="metatag">Style: <b>${escapeHtml(b.style)}</b></span>`);
  if (b.voice) tags.push(`<span class="metatag">Voice: <b>${escapeHtml(b.voice)}</b></span>`);
  if (b.destination) tags.push(`<span class="metatag">Dest: <b>${escapeHtml(b.destination)}</b></span>`);
  if (b.length) tags.push(`<span class="metatag">Length: <b>${escapeHtml(b.length)}</b></span>`);
  return tags.length ? `<div class="metarow">${tags.join("")}</div>` : "";
}

function matchesSearch(j, q) {
  if (!q) return true;
  return String(j.title || "").toLowerCase().includes(q.toLowerCase());
}

function render(m) {
  lastManifest = m;
  // ONE change-signature covering everything visible. If nothing changed, touch NOTHING —
  // no header rewrite, no grid rebuild — so the page never flashes and videos keep playing.
  const sig = m.paused + "||" + m.jobs.map(j => j.id + ":" + j.status).join("|") + "||" + [...expanded].sort().join(",") + "||" + [...playing].sort().join(",") + "||" + searchQuery;
  if (sig === lastSig) return;
  lastSig = sig;

  paused = m.paused;
  const c = m.counts;
  document.getElementById("stats").innerHTML = order.map(s =>
    `<div class="stat"><b style="color:var(--${s})">${c[s] || 0}</b><small>${labels[s]}</small></div>`
  ).join("");
  document.getElementById("paused").classList.toggle("show", m.paused);

  const buildingJobs = m.jobs.filter(j => j.status === "building");
  const authoring = buildingJobs.filter(j => j.active).length;
  const notStarted = buildingJobs.length - authoring;
  const pipeline = (c.queued || 0) + (c.voicing || 0) + (c.voiced || 0) + (c.rendering || 0);
  const runningNow = (c.voicing || 0) + (c.rendering || 0) + authoring;
  const totalLeft = notStarted + authoring + pipeline;
  const PER = 45; // measured per-video cost (voice ~30s serial + render share)
  const eta = document.getElementById("eta");
  if (m.paused) eta.innerHTML = `<b class="active-num" style="color:var(--voicing)!important">⏸ Paused</b> · ${totalLeft} waiting`;
  else if (runningNow > 0) eta.innerHTML = `<b class="active-num">▶ ${runningNow} running now</b> · ${notStarted} not started · ~<b>${fmt(totalLeft * PER)}</b> left`;
  else if (totalLeft > 0) eta.innerHTML = `<span class="idle">idle — ${totalLeft} waiting, nothing running</span>`;
  else eta.innerHTML = "all clear ✓";

  // Pause button only matters when there's work; hide it when idle so it isn't confusing.
  const btn = document.getElementById("pauseBtn");
  btn.textContent = paused ? "Resume" : "Pause";
  btn.classList.toggle("on", paused);
  btn.style.display = (paused || runningNow > 0 || pipeline > 0) ? "" : "none";

  // Global processing order → per-video position + ETA (voice is serial, so it's one line).
  const rank = { rendering: 0, voicing: 1, voiced: 2, queued: 3 };
  const line = m.jobs
    .filter(j => rank[j.status] !== undefined || j.status === "building")
    .sort((a, b) => (rank[a.status] ?? (a.active ? 4 : 5)) - (rank[b.status] ?? (b.active ? 4 : 5)) || (a.createdAt || 0) - (b.createdAt || 0));
  line.forEach((j, i) => { j._pos = i + 1; j._eta = (i + 1) * PER; });

  if (!m.jobs.length) {
    document.getElementById("main").innerHTML =
      `<div class="empty">No jobs yet.<br><br>Tell Claude a video idea — it'll appear here as <b>Building</b> instantly.</div>`;
    document.getElementById("shown").textContent = "";
    return;
  }

  const filtered = m.jobs.filter(j => matchesSearch(j, searchQuery));
  document.getElementById("shown").textContent = searchQuery.trim() ? `${filtered.length} of ${m.jobs.length} shown` : "";

  if (!filtered.length) {
    document.getElementById("main").innerHTML = `<div class="empty">No videos match "${escapeHtml(searchQuery)}".</div>`;
    return;
  }

  const byStatus = {};
  for (const j of filtered) (byStatus[j.status] = byStatus[j.status] || []).push(j);

  // Done column: newest-finished first.
  if (byStatus.done) byStatus.done.sort((a, b) => (b.finishedAt || 0) - (a.finishedAt || 0));

  const now = m.updatedAt;
  const doneList = byStatus.done || [];
  let html = '<div class="board">';
  html += `<div class="pane pane-done">
    <div class="column-head"><span class="dot-status" style="background:var(--done)"></span>${labels.done}<span class="count">${doneList.length}</span></div>
    <div class="column-body">${doneList.length ? doneList.map(j => card(j, now)).join("") : '<div class="column-empty">Nothing here</div>'}</div>
  </div>`;
  html += '<div class="pane pane-others">';
  for (const s of order) {
    if (s === "done") continue;
    const list = byStatus[s] || [];
    html += `<div class="mini-section">
      <div class="column-head"><span class="dot-status" style="background:var(--${s})"></span>${labels[s]}<span class="count">${list.length}</span></div>
      <div class="column-body">${list.length ? list.map(j => card(j, now)).join("") : '<div class="column-empty">Nothing here</div>'}</div>
    </div>`;
  }
  html += "</div></div>";

  // Rebuilding #main wipes DOM scroll state — save each pane's scroll position first,
  // then restore after, so an action deep in the Done grid (play, delete, read-more)
  // doesn't yank the view back to the top.
  const prevDoneScroll = document.querySelector(".pane-done .column-body")?.scrollTop || 0;
  const prevOthersScroll = document.querySelector(".pane-others")?.scrollTop || 0;

  document.getElementById("main").innerHTML = html;

  const doneBody = document.querySelector(".pane-done .column-body");
  if (doneBody) doneBody.scrollTop = prevDoneScroll;
  const othersPane = document.querySelector(".pane-others");
  if (othersPane) othersPane.scrollTop = prevOthersScroll;
}

function card(j, now) {
  const s = j.status;
  let meta = "", body = "";
  // right-side tag: position in line for not-yet-started videos — NO fake age timer.
  const tag = (s === "building" || s === "queued") && j._pos ? `<span class="pos">#${j._pos} in line</span>` : "";
  if (s === "building") meta = paused
    ? `<span class="idle">⏸ paused — not started</span>`
    : j.active
      ? `<span class="spinner"></span> authoring now`
      : `<span class="idle">◦ waiting to start — not begun</span>`;
  if (s === "voicing") meta = `<span class="spinner"></span> generating voice`;
  if (s === "rendering") meta = `<span class="spinner"></span> <span class="rtime" data-start="${j.renderStartedAt || now}">rendering · ${fmt((now - (j.renderStartedAt || now)) / 1000)}</span>`;
  if (s === "queued") meta = `waiting${j.needsVoice ? " · needs voice" : ""}`;
  let deleteBtn = "";
  if (s === "done") {
    const jid = escapeHtml(j.id);
    body = playing.has(j.id)
      ? `<div class="thumb-wrap"><video controls autoplay src="/output/${jid}.mp4"></video></div>`
      : `<div class="thumb-wrap" onclick="togglePlay('${jid}')"><img src="/thumbs/${jid}.jpg" alt="" /><div class="playbtn"><i></i></div></div>`;
    body += metaTags(j);
    body += `<div class="fname" title="in ~/Desktop/ready-to-post/ — click to copy" onclick="copyName('${j.id}.mp4')">📄 ${j.id}.mp4</div>`;
    deleteBtn = `<button class="card-del" title="Delete" onclick="del('${j.id}',this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path></svg>Delete</button>`;
  }
  if (s === "failed") body = `<div class="err">${escapeHtml(j.error || "unknown error")}</div>`;

  // description with read-more — for done cards this sits at the very bottom, after the video/meta.
  let briefBlock = "";
  if (j.brief) {
    const open = expanded.has(j.id);
    briefBlock = `<div class="brief${open ? " open" : ""}">${briefHtml(j.brief)}</div>
      <button class="more" onclick="toggleBrief('${j.id}')">${open ? "Show less ▲" : "Read more ▼"}</button>`;
  }
  // cancel while in progress; retry when failed; done's delete lives top-right instead
  let actions = "";
  if (s === "failed") actions = `<button onclick="act('retry','${j.id}',this)">Retry</button><button class="danger" onclick="del('${j.id}',this)">Delete</button>`;
  else if (["building", "queued", "voicing", "rendering"].includes(s)) actions = `<button class="danger" onclick="act('cancel','${j.id}',this)">Cancel</button>`;

  const metaLine = meta ? `<div class="meta"><span>${meta}</span>${tag}</div>` : "";
  return `<div class="card ${s}">
    ${deleteBtn}
    <div class="top">${fmtIcon(j.format)}<span class="title">${escapeHtml(cleanTitle(j.title))}</span></div>
    ${metaLine}
    ${s === "done" ? `${body}${briefBlock}` : `${briefBlock}${body}`}
    ${actions ? `<div class="actions">${actions}</div>` : ""}
  </div>`;
}

// aspect-ratio shape before the title: wide box = 16:9, tall box = 9:16
function fmtIcon(f) {
  if (!f) return "";
  const wide = f === "16:9";
  const w = wide ? 24 : 15, h = wide ? 15 : 24;
  return `<span class="fmt" title="${f}"><i style="width:${w}px;height:${h}px"></i></span>`;
}
function cleanTitle(t) { return String(t).replace(/\s*[\(（]?(?:16:9|9:16)[^)）]*[\)）]?\s*$/i, "").trim() || t; }
function toggleBrief(id) { expanded.has(id) ? expanded.delete(id) : expanded.add(id); if (lastManifest) render(lastManifest); }
function togglePlay(id) { playing.add(id); lastSig = ""; if (lastManifest) render(lastManifest); }
function copyName(name) { navigator.clipboard?.writeText(name); const el = event.target; const t = el.textContent; el.textContent = "📄 copied!"; setTimeout(() => el.textContent = t, 1000); }

// Tick elapsed timers in place — never rebuilds the DOM, so a playing video survives.
function updateTimers() {
  const now = Date.now();
  document.querySelectorAll(".age").forEach(el => {
    const c = +el.dataset.created; if (!c) return;
    const end = el.dataset.end ? +el.dataset.end : now;
    el.textContent = "⏱ " + fmt((end - c) / 1000);
  });
  document.querySelectorAll(".rtime").forEach(el => {
    const st = +el.dataset.start; if (st) el.textContent = "rendering · " + fmt((now - st) / 1000);
  });
}
setInterval(updateTimers, 1000);

function escapeHtml(x) { return String(x).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
// Light markdown → readable text: bold **x**, drop heading #, bullets to •.
function briefHtml(md) {
  return escapeHtml(md.trim())
    .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
    .replace(/^#{1,6}\s*/gm, "")
    .replace(/^\s*[-*]\s+/gm, "• ");
}

async function act(kind, id, btn) {
  if (btn) { btn.disabled = true; btn.textContent = "…"; }
  try { await fetch(`/${kind}?job=${encodeURIComponent(id)}`, { method: "POST" }); }
  catch { setOffline(true); if (btn) { btn.disabled = false; btn.textContent = kind === "retry" ? "Retry" : "Cancel"; } return; }
  poll();
}
async function del(id, btn) {
  if (btn.textContent !== "Sure?") { btn.textContent = "Sure?"; btn.classList.add("confirm"); setTimeout(() => { if (btn.isConnected && btn.textContent === "Sure?") { btn.textContent = "Delete"; btn.classList.remove("confirm"); } }, 3000); return; }
  btn.disabled = true; btn.textContent = "…";
  try { await fetch(`/delete?job=${encodeURIComponent(id)}`, { method: "POST" }); }
  catch { setOffline(true); btn.disabled = false; btn.textContent = "Delete"; return; }
  poll();
}
async function togglePause() {
  try { await fetch(paused ? "/resume" : "/pause", { method: "POST" }); }
  catch { setOffline(true); return; }
  poll();
}

poll();
setInterval(poll, 2000);
</script>
</body>
</html>
